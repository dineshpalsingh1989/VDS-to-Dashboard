name: Dashboard checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py runtime.py monitoring.py vds.py historian.py diagnostics.py workspace_views.py replay.py
      - run: python -m unittest discover -s tests -v
      - run: docker build -t wilcoxon-vds:ci .
